name: Latest master

# Runs whenever a PR is merged (i.e. a push lands) on a release branch.
# It builds every platform by reusing the existing package-* pipelines,
# then publishes a single GitHub release per build, tagged with the version
# and flagged "Latest". Releases from previous builds are left untouched.
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # Reuse the existing build pipelines. secrets: inherit lets the Android
  # job reach the signing / Play Store secrets just like before.
  android:
    uses: ./.github/workflows/package-android.yml
    secrets: inherit

  # Publish to the Play Store only on merge,
  # after the Android build has produced and uploaded the signed bundle,
  # and only once the tests pass: a build with failing tests must not reach users.
  # PRs build but never publish.
  publish-google-play:
    needs: [android, headless-tests]
    uses: ./.github/workflows/publish-to-google-play.yaml
    secrets: inherit

  linux-bundle:
    uses: ./.github/workflows/package-linux-bundle.yml
    secrets: inherit

  linux-deb:
    uses: ./.github/workflows/package-linux-deb.yml
    secrets: inherit

  mac:
    uses: ./.github/workflows/package-mac.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/package-windows.yml
    secrets: inherit

  wasm:
    uses: ./.github/workflows/package-wasm.yml
    secrets: inherit

  # Gate the release on the tests: a build with failing tests is not published;
  # its artifacts still upload to this run for manual testing.
  headless-tests:
    uses: ./.github/workflows/headless-tests.yml

  release:
    name: Publish latest master release
    needs: [android, linux-bundle, linux-deb, mac, windows, wasm, headless-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so git can compute an unambiguous --short length.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Determine version and tag
        id: meta
        run: |
          set -euo pipefail
          # The release is tagged with the short version (no hash); the full
          # version (with the +git.HASH provenance) goes in the release title
          # so it still identifies the exact commit.
          VERSION="$(./get_version.sh)"
          VERSION_FULL="$(./get_version_full.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_full=${VERSION_FULL}" >> "$GITHUB_OUTPUT"
          echo "Artifacts to publish:"
          ls -la dist

      - name: Publish latest master release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_FULL: ${{ steps.meta.outputs.version_full }}
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
          Automated build of OpenLieroX **${VERSION}**.

          - Branch: \`${GITHUB_REF_NAME}\`
          - Commit: ${GITHUB_SHA}

          **macOS:** this build is not notarized, so on first launch Gatekeeper warns that OpenLieroX is from an "unidentified developer".
          It is safe; allow it once with \`xattr -cr /path/to/OpenLieroX.app\`, then open it normally.
          See [the README](https://github.com/openlierox/openlierox#macos-first-run).
          EOF
          )"

          # Every package pipeline now uploads a single ready-to-publish file
          # (the bundle pipelines zip themselves so file permissions / the
          # executable bit survive). The directory handling below is kept as a
          # safety net: gh can only upload files, so any top-level directory is
          # zipped first before collecting the flat list of assets.
          shopt -s nullglob
          ASSETS=()
          for entry in dist/*; do
            # The Android App Bundle (.aab) is a Google Play upload format,
            # not a user-installable artifact (the .apk covers that). It is
            # built only to hand off to the Play Store publish workflow, so
            # keep it out of the public GitHub release.
            case "$entry" in
              *.aab) continue ;;
            esac
            if [ -d "$entry" ]; then
              ( cd dist && zip -r -q "$(basename "$entry").zip" "$(basename "$entry")" )
              ASSETS+=("${entry}.zip")
            else
              ASSETS+=("$entry")
            fi
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No artifacts found to publish" >&2
            exit 1
          fi

          echo "Publishing assets:"
          printf '  %s\n' "${ASSETS[@]}"

          # One release per build, tagged with the bare version and flagged as
          # GitHub's "Latest". The version is derived from the (always
          # increasing) commit count, so the tag is unique to this build and a
          # release can never already exist for it. Releases from previous
          # builds are left untouched.
          #
          # --prerelease=false is explicit: a release flagged as a prerelease
          # cannot also be marked --latest (GitHub returns "Latest release
          # cannot be draft or prerelease.").
          publish() {
            # Start each attempt from a clean slate:
            # if an earlier attempt created the release but failed partway
            # (e.g. a dropped asset upload),
            # remove it so the retry is not rejected with "release already exists".
            if gh release view "$VERSION" >/dev/null 2>&1; then
              gh release delete "$VERSION" --yes --cleanup-tag
            fi
            gh release create "$VERSION" "${ASSETS[@]}" \
              --title "OpenLieroX ${VERSION_FULL}" \
              --notes "$NOTES" \
              --prerelease=false \
              --latest \
              --target "$GITHUB_SHA"
          }

          # The releases API intermittently returns a spurious 403
          # ("Resource not accessible by integration") even with the right permissions.
          # Retry a few times with a growing backoff
          # so a single hiccup does not lose the build's release.
          attempt=1
          max_attempts=5
          until publish; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "gh release create failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Publish attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
