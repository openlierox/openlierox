<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenLieroX (WebAssembly)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- "Add to Home Screen" then launches the game as a standalone, full-screen
       web app (no browser chrome). iOS uses the apple-* tags; Android the
       mobile-web-app-capable one. The shell auto-fills the screen in that mode
       (see the body.standalone CSS / JS below). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenLieroX">
  <meta name="theme-color" content="#111111">
  <!-- Web app manifest + icons. The manifest is what makes "Install web app"
       offer a real install on Chromium (it needs name/icons/start_url/display);
       apple-touch-icon is the home-screen icon on iOS. start_url/scope in the
       manifest are relative ("./"), so the bundle is installable wherever it's
       hosted. These files (manifest.webmanifest, icon-256/512.png) are staged
       next to index.html by build.sh / build-wasm.sh. -->
  <link rel="icon" href="icon-256.png">
  <link rel="apple-touch-icon" href="icon-256.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd;
                 font-family: system-ui, sans-serif; overflow: hidden; }
    #wrapper   { display: flex; flex-direction: column; height: 100%;
                 align-items: center; }
    /* Loading/status text overlaid centred ON TOP of the canvas. It lives
     * inside #fs-area (which is what goes fullscreen), so it stays visible over
     * the game even in fullscreen — the browser's fullscreen top layer hides
     * anything outside the fullscreen element. Hidden by JS once loading is
     * done. pointer-events:none so it never intercepts input for the canvas. */
    #status    { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                 z-index: 10000; pointer-events: none; text-align: center; max-width: 90%;
                 padding: 10px 16px; border-radius: 6px; background: rgba(0, 0, 0, 0.75);
                 color: #ddd; font: 14px/1.4 monospace; }
    #status.err { background: #803030; color: #fff; }
    #toolbar   { padding: 4px 0; }
    #toolbar button { background: #2a2a2a; color: #ddd; border: 1px solid #444;
                      padding: 4px 10px; font: 12px system-ui, sans-serif;
                      cursor: pointer; border-radius: 3px; }
    #toolbar button:hover { background: #3a3a3a; }
    /* Lock the canvas to OLX's native resolution. Letting it stretch
     * makes mouse coordinates ambiguous (DOM vs SDL pixel space) and
     * also softens the pixel-art assets. */
    #canvas    { width: 640px; height: 480px; display: block;
                 background: #000; outline: none; image-rendering: pixelated; }
    /* The canvas + the status overlay live in #fs-area, and IT is what goes
     * fullscreen (not the canvas directly) so the overlay can sit on top in the
     * browser's fullscreen top layer. Windowed: it just hugs the 640x480
     * canvas. Fullscreen: stretch the canvas to fill the whole screen. The
     * 640x480 backing buffer is scaled to the viewport, so a wide display
     * shows the game edge to edge (stretched to the screen's aspect) with no
     * black bars. */
    #fs-area   { position: relative; width: 640px; height: 480px; }
    #fs-area:fullscreen { width: 100vw; height: 100vh; background: #000; }
    #fs-area:fullscreen #canvas { width: 100%; height: 100%; }
    /* Installed web app (iOS "Add to Home Screen" standalone / Android PWA):
     * no browser chrome, so stretch the canvas to fill the whole screen,
     * exactly like the in-page fullscreen mode. The toolbar/log aren't useful
     * there, so hide them. */
    body.standalone #toolbar, body.standalone #log { display: none; }
    body.standalone #fs-area { position: fixed; inset: 0; width: 100vw; height: 100vh;
                               background: #000; }
    body.standalone #fs-area #canvas { width: 100%; height: 100%; }
    #log       { max-height: 25vh; overflow: auto; padding: 4px 10px;
                 background: #181818; font: 12px/1.3 monospace; white-space: pre-wrap;
                 align-self: stretch; }
    #log .err  { color: #f99; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="toolbar">
      <button id="fs-toggle" type="button">Enter fullscreen</button>
      <button id="install-btn" type="button">Install web app</button>
    </div>
    <!-- #fs-area is the element that goes fullscreen — it holds both the
         canvas and the status overlay so the overlay stays visible (in the
         fullscreen top layer) while the game is still loading. -->
    <div id="fs-area">
      <!-- width/height attributes set the internal pixel buffer size.
           Without them Emscripten/SDL2 inherit the default 800x600,
           which means SDL_RenderSetLogicalSize(640,480) ends up scaling
           all mouse events and the canvas is then resized inconsistently
           on the first SDL window create. Lock to OLX's native res. -->
      <canvas id="canvas" width="640" height="480"
              tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="status">Loading OpenLieroX…</div>
    </div>
    <pre id="log"></pre>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const logEl    = document.getElementById("log");

    function appendLog(text, isErr) {
      // One line per node, so only error lines go red
      // (a single stderr line must not colour every following note).
      const line = document.createElement("div");
      if (isErr) line.className = "err";
      line.textContent = text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Latch: once the data download is complete we show "Starting OpenLieroX…"
    // and ignore further loading-status churn until the engine is ready.
    let loadingDone = false;

    // Set once an environment preflight has shown a fatal, actionable message
    // (wrong URL scheme, or no cross-origin isolation).
    // When set, the engine's own status and error churn must not overwrite it.
    let preflightFailed = false;
    function showStarting() {
      if (loadingDone) return;
      loadingDone = true;
      statusEl.style.display = "";
      statusEl.classList.remove("err");
      statusEl.textContent = "Starting OpenLieroX…";
    }

    // Startup watchdog.
    // Once every asset has loaded (monitorRunDependencies reaches 0),
    // the engine normally boots to the main menu within a few seconds
    // and calls olxOnEngineReady().
    // If it never does, startup has most likely failed
    // (a wasm abort, or a failed thread spawn that surfaced no error),
    // and the page would otherwise sit on "Starting OpenLieroX…" forever.
    // Replace that dead-end with a message pointing at the console.
    let startWatchdog = null;
    function armStartWatchdog() {
      if (startWatchdog !== null) return;
      startWatchdog = setTimeout(() => {
        // Don't stomp a clearer message that already owns the status line
        // (a preflight failure, an abort, or an engine error).
        if (preflightFailed || statusEl.classList.contains("err")) return;
        statusEl.style.display = "";
        statusEl.classList.add("err");
        statusEl.innerHTML =
          "OpenLieroX hasn’t reached the menu; startup may have failed.<br>" +
          "Check the browser console (F12 / Developer Tools) for errors.";
      }, 30000);
    }
    function clearStartWatchdog() {
      if (startWatchdog !== null) { clearTimeout(startWatchdog); startWatchdog = null; }
    }

    function exitFullscreenIfActive() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    // The engine calls this from Game::onStateUpdate (src/game/Game.cpp,
    // under __EMSCRIPTEN__) only when the application actually quits
    // (transition into S_Quit) — e.g. "Quit OpenLieroX" from the main
    // menu. Returning to the menu after a match keeps fullscreen, since
    // that usually means the player wants to start another game.
    window.olxOnEngineExit = (_state) => exitFullscreenIfActive();

    // The engine calls this from Menu_MainFrame (src/.../Menu_Main.cpp, under
    // __EMSCRIPTEN__) the first time the main menu renders — i.e. it's finished
    // the few-second boot that follows the data download. Hide the loading /
    // "Starting OpenLieroX…" overlay at that point. (Hide directly — setStatus
    // ignores updates once the "Starting…" latch is set.)
    window.olxOnEngineReady = () => { clearStartWatchdog(); statusEl.style.display = "none"; };

    var Module = {
      canvas: (() => {
        const c = document.getElementById("canvas");
        c.addEventListener("webglcontextlost", (e) => {
          alert("WebGL context lost — please reload."); e.preventDefault();
        }, false);
        return c;
      })(),
      print:    (text) => {
        if (Module.printAccept && !Module.printAccept(text)) return;
        console.log(text);
        appendLog(text, false);
      },
      printErr: (text) => {
        if (Module.printAccept && !Module.printAccept(text)) return;
        console.warn(text);
        appendLog(text, true);
      },
      setStatus: (text) => {
        // A preflight failure has shown a clearer, actionable message; keep it.
        if (preflightFailed) return;
        text = text || "";
        // Errors/aborts always win and are shown verbatim.
        if (/error|abort|exception/i.test(text)) {
          statusEl.style.display = "";
          statusEl.textContent = text;
          statusEl.classList.add("err");
          return;
        }
        // Once we've switched to "Starting OpenLieroX…" stay there (ignore the
        // run-dependency churn that follows) until olxOnEngineReady() hides it.
        if (loadingDone) return;
        // Emscripten reports the .data download as "Downloading data... (x/y)"
        // in bytes. The instant the DOWNLOAD completes (x == y), switch to
        // "Starting OpenLieroX…" — the engine still needs a few seconds to boot
        // to the menu. (Previously we waited for all run dependencies, incl. the
        // wasm, to resolve, which showed the switch too late.)
        const dl = /^Downloading data\.\.\. \((\d+)\/(\d+)\)$/.exec(text);
        if (dl && dl[1] === dl[2]) { showStarting(); return; }
        statusEl.style.display = text ? "" : "none";
        statusEl.textContent = text;
        statusEl.classList.remove("err");
      },
      monitorRunDependencies: (left) => {
        // Backstop for the cached case
        // where the byte counter may not emit a final x == y:
        // once everything's resolved, show "Starting…".
        // This is also the point where the wasm is instantiated
        // and the thread pool is up,
        // so it's when the boot-to-menu watchdog should start ticking.
        if (left === 0) { showStarting(); armStartWatchdog(); }
      },
      // Don't stream every "dependency: fp /xxx" or "(end of list)" line
      // into the on-page log; with thousands of preload files the spam
      // dwarfs the actual runtime output. Filter at print time.
      printAccept: (text) =>
        !/^(dependency:|still waiting on run dependencies|\(end of list\))/.test(text),
      onAbort: (what) => {
        exitFullscreenIfActive();
        Module.setStatus("Aborted: " + what);
      },
      onExit: () => exitFullscreenIfActive(),
    };

    // --- Environment preflight -------------------------------------------
    // This is a threaded (-pthread) build:
    // main() runs on a Web Worker,
    // and the engine can't start without SharedArrayBuffer,
    // which browsers only expose to cross-origin-isolated pages
    // served over http(s) with COOP/COEP headers.
    // Opening this page as a file:// URL, or serving it without those headers,
    // otherwise fails with an opaque "Script error." or just hangs at "Starting…".
    // Detect both cases up front and explain what to do.
    const FATAL = {
      file:
        "This WebAssembly build can’t run from a <code>file://</code> URL; " +
        "it must be served over HTTP.<br>" +
        "Use the bundled server: run <b>python3&nbsp;serve.py</b> in this folder,<br>" +
        "then open the <b>http://localhost:8000/</b> URL it prints.",
      coi:
        "OpenLieroX can’t start: this page is not cross-origin isolated, " +
        "so <b>SharedArrayBuffer</b> (required by the threaded build) is unavailable.<br>" +
        "Serve it with the COOP/COEP headers; " +
        "the bundled <b>python3&nbsp;serve.py</b> sets them for you.<br>" +
        "(A plain <code>http.server</code> only works " +
        "if <code>coi-serviceworker.js</code> is present and can register.)",
      script:
        "OpenLieroX failed to load its engine files.<br>" +
        "If you opened this as a <code>file://</code> URL, " +
        "serve it over HTTP instead: run <b>python3&nbsp;serve.py</b> in this folder.",
    };
    function showFatal(kind) {
      preflightFailed = true;
      statusEl.style.display = "";
      statusEl.classList.add("err");
      statusEl.innerHTML = FATAL[kind];
    }

    if (location.protocol === "file:") {
      showFatal("file");
    } else if (!self.crossOriginIsolated) {
      // Not isolated yet.
      // The bundled coi-serviceworker.js shim can fix this on a header-less host,
      // but only via a one-time reload,
      // and that navigation tears down this timer.
      // If we're still here and un-isolated after it's had time to act,
      // isolation isn't coming: say so instead of hanging at "Starting…".
      setTimeout(() => {
        if (!self.crossOriginIsolated && !preflightFailed) showFatal("coi");
      }, 5000);
    }

    Module.setStatus("Downloading…");
    window.onerror = (msg) => {
      if (preflightFailed) return;   // keep the clearer preflight message
      // The browser scrubs cross-origin script errors
      // down to a bare "Script error." with no detail,
      // almost always a file:// or otherwise not-served page.
      // Replace that with something actionable.
      if (typeof msg === "string" && /^script error\.?$/i.test(msg.trim())) {
        showFatal("script");
        return;
      }
      Module.setStatus("Exception: " + msg);
    };

    // Emscripten maps mouse/touch coordinates from the canvas element's
    // getBoundingClientRect() onto the 640x480 backing buffer: sdlX =
    // (clientX - rect.left) * canvas.width / rect.width (and likewise for y).
    // The canvas fills its box in every mode — windowed it's an exact 4:3 box,
    // fullscreen/standalone it's stretched to the whole screen — so the whole
    // box always maps onto the whole buffer and this default mapping is already
    // correct. No getBoundingClientRect override is needed.

    // Suppress browser shortcuts that overlap OLX gameplay bindings.
    // preventDefault only stops the browser's default action — SDL2's
    // own keyboard listener still receives the event, so the engine
    // sees the press normally. Captured at the window level so we run
    // before SDL2's handler. Skipped for form inputs in case any are
    // ever added to the shell.
    window.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                t.isContentEditable))
        return;

      // Modifier+arrow combos: Alt+Left/Right is browser back/forward,
      // Ctrl+arrows are word-skip / scroll on some platforms.
      if ((e.altKey || e.ctrlKey || e.metaKey) &&
          (e.code === "ArrowLeft"  || e.code === "ArrowRight" ||
           e.code === "ArrowUp"    || e.code === "ArrowDown")) {
        e.preventDefault();
        return;
      }

      // Bare keys that scroll or navigate the page.
      switch (e.code) {
        case "ArrowLeft": case "ArrowRight":
        case "ArrowUp":   case "ArrowDown":
        case "Space":     case "Tab":
        case "Backspace": case "F1":
          e.preventDefault();
          break;
      }
      // Intentionally NOT swallowed: F5/Ctrl+R (reload), F11 (browser
      // fullscreen escape hatch), F12 (devtools), Esc.
    }, true);

    // Web Fullscreen toggle. We fullscreen #fs-area (the canvas + the status
    // overlay), NOT the canvas itself, so the loading/status text stays visible
    // on top while the game loads (the fullscreen top layer hides anything
    // outside the fullscreen element). This is independent of SDL/OLX
    // fullscreen (kWasmAllowFullscreen in AuxLib.cpp), which is disabled. The
    // canvas keeps its 640x480 buffer; CSS scales it to the screen.
    (() => {
      const fsArea = document.getElementById("fs-area");
      const btn    = document.getElementById("fs-toggle");

      // Launched as an installed web app (iOS standalone / Android PWA)? No
      // browser chrome — fill the screen automatically (see body.standalone CSS).
      const standalone = window.navigator.standalone === true ||
        (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches ||
                               window.matchMedia("(display-mode: fullscreen)").matches));
      if (standalone) document.body.classList.add("standalone");

      // The Fullscreen API isn't supported on iOS Safari (only <video>), so the
      // Enter-fullscreen button does nothing there — hide it. Use "Install web
      // app" instead to get a real full-screen experience.
      if (!document.fullscreenEnabled) {
        btn.style.display = "none";
      } else {
        btn.addEventListener("click", () => {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            fsArea.requestFullscreen().catch((e) =>
              appendLog("Fullscreen request failed: " + e, true));
          }
        });
        document.addEventListener("fullscreenchange", () => {
          btn.textContent = document.fullscreenElement
            ? "Exit fullscreen" : "Enter fullscreen";
        });
      }
    })();

    // "Install web app" button. On Chromium (desktop/Android) we capture the
    // beforeinstallprompt event and fire it on click. iOS has no such API, so
    // there we show the manual "Share -> Add to Home Screen" instructions.
    (() => {
      const installBtn = document.getElementById("install-btn");
      const isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      if (isStandalone) { installBtn.style.display = "none"; return; } // already installed

      const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent) ||
        // iPadOS 13+ reports as Mac; detect the touch-capable case.
        (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);

      let deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener("appinstalled", () => { installBtn.style.display = "none"; });

      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {                       // Chromium: real install prompt
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          return;
        }
        if (isIOS) {                                // iOS: manual instructions
          alert("To install OpenLieroX as a full-screen app:\n\n" +
                "1. Tap the Share button (the square with an up-arrow).\n" +
                "2. Choose \"Add to Home Screen\".\n" +
                "3. Launch it from the new home-screen icon — it opens full screen.");
          return;
        }
        alert("Use your browser's menu to install this app " +
              "(e.g. \"Install\" / \"Add to Home Screen\").");
      });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
